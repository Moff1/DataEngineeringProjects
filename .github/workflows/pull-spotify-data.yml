name: Pull Spotify Data from Google Drive

on:
  schedule:
    - cron: '0 9 5 3 *'
  workflow_dispatch:
  push:
    branches: [ SpotifyUnWrapped ]

# Add these permissions
permissions:
  contents: write     # This allows the bot to push changes

jobs:
  sync-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # Important

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth pandas

      - name: Run Google Drive Download Script
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python pull_from_drive.py

      - name: Commit and push new files (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Spotify data from Google Drive"
            git push
          fi
