name: Pull Spotify Data from Google Drive

on:
  schedule:
    - cron: '0 9 5 3 *'      # Every year on March 5th at 9:00 AM UTC
  workflow_dispatch:

jobs:
  sync-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth pandas

      - name: Run Google Drive Download Script
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python pull_from_drive.py

      - name: Commit and push new files (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Spotify data from Google Drive (${{ github.event.schedule || 'manual' }})"
            git push
          fi
